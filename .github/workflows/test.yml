name: tests

# Runs the test suite on every push and pull request. The tests need no credentials: MELCloud,
# the price feed and the weather are faked.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # the VM's and the local venv's version
      - uses: actions/setup-node@v7
        with:
          node-version: "26"       # the LTS line; "26" picks up each security release (the page tests run node)
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
